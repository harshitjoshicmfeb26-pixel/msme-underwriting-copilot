[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msme-underwriting-copilot"
version = "0.1.0"
description = "Production-oriented PostgreSQL foundation for MSME credit intelligence"
requires-python = ">=3.11"
dependencies = ["alembic>=1.13,<2", "pydantic>=2.7,<3", "pydantic-settings>=2.2,<3", "psycopg[binary]>=3.1,<4", "SQLAlchemy>=2.0,<3"]

[project.optional-dependencies]
dev = ["mypy>=1.10,<2", "pytest>=8,<9", "pytest-cov>=5,<6", "python-dotenv>=1.0,<2", "ruff>=0.5,<1"]

[project.scripts]
msme-generate = "msme_copilot.synthetic.generate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/msme_copilot"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a PostgreSQL database"]
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "I001"]
[tool.mypy]
python_version = "3.11"
strict = true
