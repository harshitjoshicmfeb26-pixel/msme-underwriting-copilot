name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: msme_copilot
          POSTGRES_USER: msme
          POSTGRES_PASSWORD: msme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U msme -d msme_copilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: alembic upgrade head
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: msme_copilot
          DB_USER: msme
          DB_PASSWORD: msme
      - run: pytest
